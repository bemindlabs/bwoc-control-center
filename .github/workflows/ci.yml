name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust core
        id: d
        run: test -f src-tauri/Cargo.toml && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false (no src-tauri yet — gate passes)"
      - if: steps.d.outputs.go == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.d.outputs.go == 'true'
        name: System deps (Tauri/Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - if: steps.d.outputs.go == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            bwocd
      - if: steps.d.outputs.go == 'true'
        name: fmt + clippy + test (src-tauri)
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features
      - if: steps.d.outputs.go == 'true'
        name: fmt + clippy + test (bwocd)
        working-directory: bwocd
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-features

  frontend:
    name: Frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: d
        run: test -f package.json && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false (no package.json yet — gate passes)"
      - if: steps.d.outputs.go == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.d.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.d.outputs.go == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.d.outputs.go == 'true'
        name: typecheck
        run: pnpm run typecheck || pnpm exec tsc --noEmit
      - if: steps.d.outputs.go == 'true'
        name: lint
        run: pnpm run lint
      - if: steps.d.outputs.go == 'true'
        name: build
        run: pnpm run build
