name: build

# Compile the app for every target — macOS (desktop), iOS, and Android — so a
# broken build surfaces in CI, not at release. Builds are UNSIGNED (compile /
# packaging verification); real distribution signing (certs, keystores) is a
# follow-up wired via repo secrets. Runs on push to main, PRs, and manually.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: these jobs build and test; none of them writes to the repo.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── macOS desktop ──────────────────────────────────────────────────────────
  macos:
    name: macOS (desktop)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build (universal .app + .dmg)
        run: pnpm tauri build --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: bwoc-control-center-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

  # ── iOS (compile check) ──────────────────────────────────────────────────────
  # A full `tauri ios build` runs xcodebuild against `-sdk iphoneos`, which needs
  # a signing team/provisioning even with -allowProvisioningUpdates — impossible
  # unsigned in CI (it fails "Unable to load workspace"/code 74). So verify the
  # iOS *compile* (the part that breaks on code changes) via the Rust iOS target.
  # A signed device/App Store build (certs + xcodebuild archive) is a follow-up.
  ios:
    name: iOS (compile check)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build frontend (dist/ for the Rust build)
        run: pnpm build
      - name: Compile Rust for iOS (aarch64-apple-ios)
        working-directory: src-tauri
        run: cargo build --lib --target aarch64-apple-ios

  # ── Android ──────────────────────────────────────────────────────────────────
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      # One source of truth: the install step and NDK_HOME must name the same NDK.
      NDK_VERSION: 27.0.12077973
    steps:
      # A universal debug APK for four ABIs outgrows the runner's free disk
      # ("No space left on device" in :app:packageUniversalDebug). Drop
      # toolchains this job never uses before the NDK/Gradle build starts.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}/CodeQL"
          df -h /
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install NDK
        run: sdkmanager "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Ensure Android project
        # gen/android isn't committed yet — init generates the Gradle project.
        run: |
          [ -d src-tauri/gen/android ] || pnpm tauri android init --ci
      - name: Build (unsigned debug APK)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: pnpm tauri android build --apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: bwoc-control-center-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
