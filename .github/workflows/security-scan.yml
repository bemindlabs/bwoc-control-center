name: Security Scan

# RULE (bemindlabs): every project must pass Semgrep (SAST) + Trivy (VA: deps/secrets/IaC)
# before going to production. Required gate on main + PRs, and callable (workflow_call) so
# deploy/release workflows can depend on it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep
        run: pipx install semgrep || pip install --user semgrep
      - name: Semgrep scan (fail on ERROR findings)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --error --severity ERROR

  trivy:
    name: Trivy VA (deps · secrets · IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        # Pinned: the installer script comes from a release tag (not `main`) and
        # installs that exact version, so CI is reproducible and a change on
        # trivy's main branch can't run as root here. Bump both together.
        env:
          TRIVY_VERSION: v0.74.0
        run: curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Trivy VA scan (fail on HIGH/CRITICAL)
        run: |
          trivy fs --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 .
