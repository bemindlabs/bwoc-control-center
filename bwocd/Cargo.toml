[package]
name = "bwocd"
version = "0.1.0"
description = "BWOC control daemon — wraps `bwoc --json` behind an ed25519-signed HTTP API (tailnet-only)"
authors = ["bemindlabs"]
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
anyhow = "1"

[dev-dependencies]
rand = "0.8"
