<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B2230"/>
      <stop offset="1" stop-color="#12161F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) scale(270)">
      <stop offset="0" stop-color="#4FD0DC" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#36B4C1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#36B4C1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hubFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 512) scale(102)">
      <stop offset="0" stop-color="#4FD0DC"/>
      <stop offset=".62" stop-color="#36B4C1"/>
      <stop offset="1" stop-color="#2A8C97"/>
    </radialGradient>
    <linearGradient id="link" x1="352" y1="352" x2="672" y2="672" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD0DC" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#36B4C1" stop-opacity=".74"/>
      <stop offset="1" stop-color="#4FD0DC" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="satellite" x1="0" y1="0" x2="0" y2="1" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4FD0DC"/>
      <stop offset="1" stop-color="#2A8C97"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <circle cx="512" cy="512" r="304" fill="none" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="4"/>
  <circle cx="512" cy="512" r="178" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="2"/>

  <g stroke="url(#link)" stroke-linecap="round" stroke-width="20">
    <g>
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
    <g transform="rotate(45 512 512)">
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
    <g transform="rotate(90 512 512)">
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
    <g transform="rotate(135 512 512)">
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
    <g transform="rotate(180 512 512)">
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
    <g transform="rotate(225 512 512)">
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
    <g transform="rotate(270 512 512)">
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
    <g transform="rotate(315 512 512)">
      <line x1="512" y1="640" x2="512" y2="812"/>
      <circle cx="512" cy="812" r="26" fill="url(#satellite)" stroke="#4FD0DC" stroke-opacity=".24" stroke-width="2"/>
    </g>
  </g>

  <circle cx="512" cy="512" r="134" fill="#36B4C1" fill-opacity=".08"/>
  <circle cx="512" cy="512" r="102" fill="url(#hubFill)"/>
  <circle cx="512" cy="512" r="102" fill="none" stroke="#4FD0DC" stroke-opacity=".4" stroke-width="2"/>
  <circle cx="512" cy="512" r="58" fill="#12161F" fill-opacity=".2"/>
  <circle cx="512" cy="512" r="34" fill="#4FD0DC" fill-opacity=".18" stroke="#4FD0DC" stroke-opacity=".58" stroke-width="2"/>
  <circle cx="512" cy="512" r="12" fill="#4FD0DC"/>
